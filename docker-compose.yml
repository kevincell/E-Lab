services:
  app:
    build: .
    container_name: elab-app
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 12 --threads 4 --worker-class gthread --max-requests 1000 --max-requests-jitter 100 --timeout 60 --keep-alive 5 --log-level info --preload
    env_file: .env
    environment:
      - HOST_SANDBOX_DIR=/home/kevin/Projects/E-Lab/sandbox_data
    volumes:
      - .:/app
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ./sandbox_data:/var/elab-sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "6"
          memory: 4G
        reservations:
          cpus: "3"
          memory: 2G
    networks:
      - elab-network

  worker:
    build: .
    container_name: elab-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 4
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
      - ./sandbox_data:/var/elab-sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
    networks:
      - elab-network

  beat:
    build: .
    container_name: elab-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - elab-db
      - elab-redis
    networks:
      - elab-network

  elab-db:
    image: postgres:15-alpine
    container_name: elab-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elab-network

  elab-redis:
    image: redis:7-alpine
    container_name: elab-redis
    restart: unless-stopped
    networks:
      - elab-network

  nginx:
    image: nginx:1.27-alpine
    container_name: elab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/var/www/static
      - media:/var/www/media
    depends_on:
      - app
    networks:
      - elab-network

volumes:
  postgres_data:
  media:
  staticfiles:

networks:
  elab-network:
    driver: bridge