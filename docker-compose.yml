services:
  app:
    build: .
    container_name: elab-app
    restart: unless-stopped
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 16 --threads 4 --worker-class gthread --max-requests 2000 --max-requests-jitter 200 --timeout 120 --keep-alive 5 --log-level info --preload
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
      - staticfiles:/app/staticfiles
      - ./sandbox_data:/var/elab-sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 6G
        reservations:
          cpus: "4"
          memory: 4G
    networks:
      - elab-network

  worker:
    build: .
    container_name: elab-worker
    restart: unless-stopped
    command: celery -A config worker -l info --concurrency 16 --pool=prefork --max-tasks-per-child 200 --max-memory-per-child 512000
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
      - ./sandbox_data:/var/elab-sandbox
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - elab-db
      - elab-redis
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
    networks:
      - elab-network

  beat:
    build: .
    container_name: elab-beat
    restart: unless-stopped
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    volumes:
      - .:/app
      - media:/app/media
    depends_on:
      - elab-db
      - elab-redis
    networks:
      - elab-network

  elab-db:
    image: postgres:15-alpine
    container_name: elab-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_MAX_CONNECTIONS: "500"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_WORK_MEM: "4MB"
      POSTGRES_MAINTENANCE_WORK_MEM: "64MB"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - elab-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elab -d elab_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  elab-redis:
    image: redis:7-alpine
    container_name: elab-redis
    restart: unless-stopped
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru --timeout 300 --tcp-keepalive 60
    volumes:
      - redis_data:/data
    networks:
      - elab-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    image: nginx:1.27-alpine
    container_name: elab-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf
      - staticfiles:/var/www/static
      - media:/var/www/media
    depends_on:
      - app
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 512M
    networks:
      - elab-network

volumes:
  postgres_data:
  media:
  staticfiles:
  redis_data:

networks:
  elab-network:
    driver: bridge
